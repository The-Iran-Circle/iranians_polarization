<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>شبکه روان‌شناسی سیاسی دیاسپورای ایران</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0b0e17;
  --surface:  #131622;
  --surface2: #1a1e2e;
  --surface3: #20253a;
  --border:   #252a3d;
  --border2:  #2f3550;
  --text:     #dde1f0;
  --text-dim: #6a7192;
  --text-mid: #9aa0bc;
  --accent:   #7c9ef8;
  --accent2:  #a78bfa;
  --positive: #5ecba1;
  --negative: #f07070;
  --radius:   10px;
  --panel-h:  42vh;  /* panel height on mobile (bottom sheet) */
}

html, body {
  font-family: 'Vazirmatn', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100%;
  width: 100%;
  overflow: hidden;
  direction: rtl;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* ═══════════════════════════════════════════════════════
   LAYOUT: desktop = side panel, mobile = bottom sheet
═══════════════════════════════════════════════════════ */
.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  height: 100vh;
}

header {
  padding: 8px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  z-index: 10;
}

header h1 {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  flex: 1;
  line-height: 1.4;
}
header h1 span { color: var(--text-dim); font-weight: 400; font-size: 10px; }

.controls {
  display: flex;
  align-items: center;
  gap: 6px;
}

.ctrl-group {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 3px 8px;
}
.ctrl-label { font-size: 9px; color: var(--text-dim); white-space: nowrap; }

input[type=range] {
  width: 70px; accent-color: var(--accent); direction: ltr;
  -webkit-appearance: none;
  height: 4px;
  background: var(--border2);
  border-radius: 2px;
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  touch-action: none;
}

select {
  background: transparent; border: none;
  color: var(--text); font-size: 10px;
  font-family: 'Vazirmatn', sans-serif;
  outline: none; cursor: pointer; direction: rtl;
}
select option { background: var(--surface2); }

.btn {
  font-family: 'Vazirmatn', sans-serif;
  font-size: 10px; font-weight: 500;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-mid);
  padding: 5px 10px;
  border-radius: 7px;
  cursor: pointer;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}

/* ── Canvas ── */
.canvas-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, #0f1526 0%, var(--bg) 70%);
  min-height: 0;
}
.canvas-wrap::before {
  content: '';
  position: absolute; inset: 0;
  background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
  background-size: 28px 28px;
  opacity: 0.25;
  pointer-events: none;
}

svg#graph { width: 100%; height: 100%; touch-action: none; }

.node { cursor: pointer; }
.node text { pointer-events: none; }
.faded { opacity: 0.05 !important; }

/* ── DESKTOP: side panel ── */
.main-body {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  flex-direction: row-reverse;
}

#side-panel {
  width: 290px;
  min-width: 290px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── MOBILE: bottom sheet ── */
#bottom-sheet {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border2);
  border-radius: 16px 16px 0 0;
  z-index: 50;
  flex-direction: column;
  max-height: 85dvh;
  max-height: 85vh;
  transition: transform 0.32s cubic-bezier(.4,0,.2,1);
  transform: translateY(100%);
  will-change: transform;
}
#bottom-sheet.open { transform: translateY(0); }

.sheet-handle-wrap {
  padding: 10px 0 4px;
  display: flex;
  justify-content: center;
  cursor: grab;
}
.sheet-handle {
  width: 36px; height: 4px;
  background: var(--border2);
  border-radius: 2px;
}
.sheet-close {
  position: absolute;
  top: 10px; left: 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 13px;
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-family: 'Vazirmatn', sans-serif;
}

/* ── Shared panel content ── */
.panel-inner {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

.panel-section {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#node-name {
  font-size: 14px; font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px; line-height: 1.4;
}
#node-name-m {
  font-size: 14px; font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px; line-height: 1.4;
}
#node-desc   { font-size: 11px; color: var(--text); line-height: 1.7; margin-bottom: 8px; }
#node-desc-m { font-size: 11px; color: var(--text); line-height: 1.7; margin-bottom: 8px; }

.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.tag {
  font-size: 9px; font-weight: 500;
  padding: 2px 7px; border-radius: 5px;
  border: 1px solid; white-space: nowrap;
}

.bar-row {
  display: flex; align-items: center; gap: 8px; margin-top: 4px;
}
.bar-label { font-size: 9px; color: var(--text-dim); white-space: nowrap; }
.bar-val   { font-size: 10px; font-weight: 600; color: var(--accent); margin-right: 4px; }
.bar-track {
  flex: 1; height: 4px;
  background: var(--surface3); border-radius: 2px; overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px;
  transition: width 0.4s cubic-bezier(.4,0,.2,1);
  direction: ltr;
}

/* Neighbours list */
.nb-scroll {
  flex: 1; overflow-y: auto;
  padding: 8px 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
  -webkit-overflow-scrolling: touch;
}
.nb-scroll::-webkit-scrollbar { width: 3px; }
.nb-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.nb-header {
  font-size: 9px; font-weight: 600; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.07em;
  margin-bottom: 6px; padding: 0 4px;
}

.nb-item {
  display: flex; align-items: flex-start; gap: 7px;
  padding: 7px 7px; border-radius: 8px;
  margin-bottom: 3px; cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.12s, border-color 0.12s;
  flex-direction: row-reverse;
  -webkit-tap-highlight-color: transparent;
}
.nb-item:active, .nb-item:hover {
  background: var(--surface2); border-color: var(--border);
}
.nb-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
.nb-body { flex: 1; min-width: 0; }
.nb-name { font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 1px; }
.nb-desc {
  font-size: 10px; color: var(--text-dim); line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.nb-weight {
  font-size: 10px; font-weight: 700; flex-shrink: 0;
  padding: 2px 5px; border-radius: 4px; border: 1px solid;
  direction: ltr; align-self: center;
}

/* Legend */
#legend {
  padding: 7px 12px;
  border-top: 1px solid var(--border);
  background: var(--surface2);
  flex-shrink: 0;
}
.legend-title {
  font-size: 9px; font-weight: 600; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 4px;
}
.legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.lg-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 9px; color: var(--text-dim);
  padding: 2px 3px; border-radius: 4px;
  cursor: pointer;
  flex-direction: row-reverse;
}
.lg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* Empty hint */
#empty-hint {
  padding: 16px 14px;
  font-size: 11px; color: var(--text-dim);
  line-height: 1.9; flex-shrink: 0;
}
#empty-hint .hint-title {
  font-size: 12px; font-weight: 600;
  color: var(--text-mid); margin-bottom: 8px;
}
.hint-item {
  display: flex; align-items: center; gap: 7px;
  margin-bottom: 4px; flex-direction: row-reverse;
}
.hint-icon { font-size: 12px; width: 18px; text-align: center; }

/* Mobile tap hint badge */
#tap-hint {
  display: none;
  position: absolute;
  bottom: 16px; left: 50%;
  transform: translateX(-50%);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 7px 16px;
  font-size: 11px; color: var(--text-mid);
  pointer-events: none;
  white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  z-index: 5;
}

/* Tooltip (desktop only) */
.tooltip {
  position: fixed;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 7px 11px;
  font-size: 11px; color: var(--text);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s;
  max-width: 220px; line-height: 1.6;
  z-index: 200; text-align: right;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

/* ── Responsive breakpoint ── */
@media (max-width: 700px) {
  header h1 span { display: none; }
  #side-panel    { display: none !important; }
  #bottom-sheet  { display: flex; }
  #tap-hint      { display: block; }

  /* On mobile, canvas takes full remaining height */
  .main-body { flex-direction: column; }
  .canvas-wrap { flex: 1; }

  .ctrl-label { display: none; }
  input[type=range] { width: 55px; }
  header { padding: 6px 10px; }
}

@media (min-width: 701px) {
  .main-body { flex-direction: row-reverse; }
}
</style>
</head>

<div class="app">

  <header>

      <button class="btn" id="reset-btn">↺</button>
      <div class="ctrl-group">
        <span class="ctrl-label">رنگ</span>

    <h1>شبکه روان‌شناسی سیاسی دیاسپورای ایران <span>· EBICglasso · n=۶۰۱</span></h1>

  <div class="main-body">

    <div class="canvas-wrap">
      <svg id="graph"></svg>

    <!-- Desktop side panel -->
    <div id="side-panel">
      <div class="panel-inner" id="desktop-inner">

          <div class="hint-title">بازرسی گره‌ها</div>

          <div class="hint-item"><span class="hint-icon">◆</span><span>لوزی = نظام سیاسی</span></div>
          <div class="hint-item"><span class="hint-icon">●</span><span>دایره = گویه EFA</span></div>

        <div id="node-detail-d" style="display:none">
          <div class="panel-section">
            <div id="node-name"></div>
            <div id="node-desc"></div>
            <div class="tags" id="node-tags-d"></div>
            <div class="bar-row">
              <span class="bar-label">مرکزیت</span>
              <div class="bar-track"><div class="bar-fill" id="bar-fill-d"></div></div>
              <span class="bar-val" id="bar-val-d"></span>
            </div>
          </div>
          <div class="nb-scroll">
            <div class="nb-header" id="nb-header-d"></div>
            <div id="nb-list-d"></div>
          </div>
        </div>
        <div id="legend">
          <div class="legend-title" id="legend-title">دسته‌بندی</div>
          <div class="legend-grid" id="legend-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile bottom sheet -->
  <div id="bottom-sheet">
    <div class="sheet-handle-wrap" id="sheet-handle">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-close" id="sheet-close">✕</div>
    <div class="panel-inner">
      <div class="panel-section" id="mobile-node-section" style="flex-shrink:0">
        <div id="node-name-m" style="display:none"></div>
        <div id="node-desc-m" style="display:none"></div>
        <div class="tags" id="node-tags-m"></div>
        <div class="bar-row" id="bar-row-m" style="display:none">
          <span class="bar-label">مرکزیت</span>
          <div class="bar-track"><div class="bar-fill" id="bar-fill-m"></div></div>
          <span class="bar-val" id="bar-val-m"></span>
        </div>
      </div>
      <div class="nb-scroll">
        <div class="nb-header" id="nb-header-m"></div>
        <div id="nb-list-m"></div>
      </div>
    </div>
  </div>

</div><!-- .app -->

const BLOCK_COLORS = {
  'SDO':'#4e79a7','ACT':'#e15759','CWV/DW':'#76b7b2',
  'MFQ':'#f28e2b','CM':'#59a14f','HotButton':'#edc948',
  'Sym.Nation':'#9c755f','Identity':'#bab0ac',
  'Sys.Label':'#e63946','Sys.Def':'#ff6b35'
};
const FACTOR_COLORS = {
  'F1':'#e63946','F2':'#2a9d8f','F3':'#e9c46a',
  'F4':'#457b9d','F5':'#a8dadc','F6':'#81b29a','N/A':'#888'
};
const BLOCK_FA = {
  'SDO':'تسلط‌طلبی','ACT':'اقتدارگرایی','CWV/DW':'جهان رقابتی',
  'MFQ':'بنیان اخلاقی','CM':'ذهن بسته','HotButton':'سیاست عملی',
  'Sym.Nation':'ملی‌گرایی نمادین','Identity':'هویت ایرانی',
  'Sys.Label':'نظام سیاسی (نام)','Sys.Def':'نظام سیاسی (تعریف)'
};
const FACTOR_FA = {
  'F1':'ملی‌گرایی رادیکال','F2':'افتخار فرهنگی ملی','F3':'محافظه‌کاری اجتماعی',
  'F4':'تسلط‌طلبی اجتماعی','F5':'ایرانی‌بودن مدنی/فرهنگی','F6':'دموکراسی لیبرال','N/A':'نظام سیاسی'
};

const isMobile = () => window.innerWidth <= 700;
let colorMode = 'block', threshold = 0.05;
let visNodes, visLinks, sim;

const svg  = d3.select('#graph');
const wrap = document.querySelector('.canvas-wrap');
const W    = () => wrap.clientWidth;
const H    = () => wrap.clientHeight;

const zoom = d3.zoom().scaleExtent([0.1,6])
  .on('zoom', e => container.attr('transform', e.transform));
svg.call(zoom);

const container  = svg.append('g');
const linkLayer  = container.append('g');
const nodeLayer  = container.append('g');

/* ── Build ─────────────────────────────────────────────────── */
function build(thr) {
  threshold = thr;
  visLinks  = GRAPH.edges.filter(e => Math.abs(e.weight) >= thr);
  const connected = new Set();
  visLinks.forEach(e => { connected.add(e.source); connected.add(e.target); });
  GRAPH.nodes.forEach(n => { if(n.isSys) connected.add(n.id); });
  visNodes  = GRAPH.nodes.filter(n => connected.has(n.id));
  const vIds = new Set(visNodes.map(n=>n.id));
  visLinks = visLinks.filter(e => vIds.has(e.source) && vIds.has(e.target));
  draw();
}

function getColor(d) {
  return colorMode==='block' ? (BLOCK_COLORS[d.block]||'#888') : (FACTOR_COLORS[d.factor]||'#888');
}

/* ── Draw ──────────────────────────────────────────────────── */
function draw() {
  linkLayer.selectAll('*').remove();
  nodeLayer.selectAll('*').remove();
  const maxStr = d3.max(visNodes, d=>d.strength)||1;

  const link = linkLayer.selectAll('line')
    .data(visLinks, d=>d.source+'-'+d.target)
    .join('line')
    .attr('stroke', d => d.weight>0 ? '#5ecba1' : '#f07070')
    .attr('stroke-opacity', d => 0.18+Math.abs(d.weight)*1.4)
    .attr('stroke-width',   d => Math.abs(d.weight)*10)
    .attr('stroke-dasharray', d => d.weight<0 ? '4,3' : null);

  const node = nodeLayer.selectAll('.node')
    .data(visNodes, d=>d.id)
    .join('g').attr('class','node')
    .call(d3.drag()
      .on('start',(e,d)=>{ if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag', (e,d)=>{ d.fx=e.x; d.fy=e.y; })
      .on('end',  (e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }))
    .on('click',   (e,d)=>{ e.stopPropagation(); selectNode(d); })
    .on('dblclick',(e,d)=>{ e.stopPropagation(); focusNode(d); })
    .on('mouseover',(e,d)=>{ if(!isMobile()) showTip(e,d); })
    .on('mousemove', moveTip)
    .on('mouseout',  hideTip);

  node.each(function(d) {
    const g=d3.select(this), col=getColor(d);
    const r = 5+(d.strength/maxStr)*16;
    if(d.isSys) {
      const s=r*1.4;
      g.append('polygon')
        .attr('points',`0,${-s} ${s},0 0,${s} ${-s},0`)
        .attr('fill',col).attr('stroke','rgba(255,255,255,0.2)').attr('stroke-width',1.2);
    } else {
      g.append('circle').attr('r',r)
        .attr('fill',col).attr('stroke','rgba(255,255,255,0.15)').attr('stroke-width',1);
    }
    const fontSize = isMobile() ? '7px' : '8px';
    g.append('text').text(d.label_fa||d.label)
      .attr('dy',(d.isSys?r*1.4:r)+8)
      .attr('text-anchor','middle')
      .attr('font-family',"'Vazirmatn', sans-serif")
      .attr('font-size', fontSize).attr('font-weight','500')
      .attr('fill',col).attr('opacity',0.88);
  });

  if(sim) sim.stop();
  sim = d3.forceSimulation(visNodes)
    .force('link', d3.forceLink(visLinks).id(d=>d.id)
      .strength(d=>Math.abs(d.weight)*0.5)
      .distance(d=>80-Math.abs(d.weight)*38))
    .force('charge', d3.forceManyBody().strength(isMobile()?-90:-120))
    .force('center', d3.forceCenter(W()/2,H()/2))
    .force('collision', d3.forceCollide(d=>7+(d.strength/maxStr)*14))
    .on('tick',()=>{
      link
        .attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
        .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      node.attr('transform',d=>`translate(${d.x},${d.y})`);
    });

  svg.on('click', deselect);
}

/* ── Select ────────────────────────────────────────────────── */
function selectNode(d) {
  const nbLinks = visLinks.filter(e=>e.source.id===d.id||e.target.id===d.id);
  const nbIds   = new Set(nbLinks.map(e=>e.source.id===d.id?e.target.id:e.source.id));
  nbIds.add(d.id);

  nodeLayer.selectAll('.node').classed('faded', nd=>!nbIds.has(nd.id));
  linkLayer.selectAll('line').classed('faded', e=>e.source.id!==d.id&&e.target.id!==d.id);
  nodeLayer.selectAll('.node').filter(nd=>nd.id===d.id)
    .select('circle,polygon').attr('stroke','white').attr('stroke-width',2.5);

  const neighbours = nbLinks.map(e=>{
    const oid=e.source.id===d.id?e.target.id:e.source.id;
    return {node:GRAPH.nodes.find(n=>n.id===oid), weight:e.weight};
  }).sort((a,b)=>Math.abs(b.weight)-Math.abs(a.weight));

  const maxStr = d3.max(GRAPH.nodes,n=>n.strength)||1;

  if(isMobile()) {
    populateMobile(d, neighbours, maxStr);
    openSheet();
    // Hide tap hint
    document.getElementById('tap-hint').style.display='none';
  } else {
    populateDesktop(d, neighbours, maxStr);
  }
}

function populateContent(d, neighbours, maxStr, suffix) {
  const nameEl = document.getElementById('node-name'+suffix);
  const descEl = document.getElementById('node-desc'+suffix);
  const tagsEl = document.getElementById('node-tags-'+suffix.replace('-',''));
  const barFill= document.getElementById('bar-fill'+suffix);
  const barVal = document.getElementById('bar-val'+suffix);
  const nbHdr  = document.getElementById('nb-header'+suffix);
  const nbList = document.getElementById('nb-list'+suffix);

  if(nameEl) { nameEl.textContent = d.label_fa||d.label; nameEl.style.display='block'; }
  if(descEl) { descEl.textContent = d.full_fa||d.full;   descEl.style.display='block'; }

  if(tagsEl) {
    tagsEl.innerHTML='';
    const bc=BLOCK_COLORS[d.block]||'#888';
    const bt=document.createElement('span');
    bt.className='tag'; bt.textContent=d.block_fa||BLOCK_FA[d.block]||d.block;
    bt.style.cssText=`color:${bc};border-color:${bc}44;background:${bc}18`;
    tagsEl.appendChild(bt);
    if(d.factor&&d.factor!=='N/A'){
      const fc=FACTOR_COLORS[d.factor];
      const ft=document.createElement('span');
      ft.className='tag'; ft.textContent=d.factor_fa||FACTOR_FA[d.factor]||d.factor;
      ft.style.cssText=`color:${fc};border-color:${fc}44;background:${fc}18`;
      tagsEl.appendChild(ft);
    }
  }
  if(barFill) barFill.style.width=(d.strength/maxStr*100)+'%';
  if(barVal)  barVal.textContent=d.strength.toFixed(3);
  if(nbHdr)   nbHdr.textContent=`گره‌های متصل (${neighbours.length})`;
  if(nbList) {
    nbList.innerHTML='';
    neighbours.forEach(({node:nb,weight})=>{
      const item=document.createElement('div');
      item.className='nb-item';
      item.onclick=()=>{ const vn=visNodes.find(n=>n.id===nb.id); if(vn) selectNode(vn); };
      const dot=document.createElement('div');
      dot.className='nb-dot'; dot.style.background=BLOCK_COLORS[nb.block]||'#888';
      const body=document.createElement('div'); body.className='nb-body';
      const name=document.createElement('div'); name.className='nb-name';
      name.textContent=nb.label_fa||nb.label;
      const desc=document.createElement('div'); desc.className='nb-desc';
      desc.textContent=nb.full_fa||nb.full;
      body.appendChild(name); body.appendChild(desc);
      const wEl=document.createElement('div'); wEl.className='nb-weight';
      const sign=weight>=0?'+':'';
      wEl.textContent=sign+weight.toFixed(3);
      const wc=weight>0?'#5ecba1':'#f07070';
      wEl.style.cssText=`color:${wc};border-color:${wc}44;background:${wc}11`;
      item.appendChild(wEl); item.appendChild(body); item.appendChild(dot);
      nbList.appendChild(item);
    });
  }
}

function populateDesktop(d,neighbours,maxStr){
  document.getElementById('empty-hint').style.display='none';
  document.getElementById('node-detail-d').style.display='block';
  // Show bar row
  document.getElementById('node-desc').style.display='block';
  populateContent(d,neighbours,maxStr,'-d');
  // aliases for desktop ids that don't have suffix
  document.getElementById('node-name').textContent=d.label_fa||d.label;
  document.getElementById('node-desc').textContent=d.full_fa||d.full;
}

function populateMobile(d,neighbours,maxStr){
  document.getElementById('bar-row-m').style.display='flex';
  populateContent(d,neighbours,maxStr,'-m');
}

function focusNode(d){
  if(!d.x||!d.y) return;
  svg.transition().duration(450).call(zoom.transform,
    d3.zoomIdentity.translate(W()/2-d.x*2.2,H()/2-d.y*2.2).scale(2.2));
}

function deselect(){
  nodeLayer.selectAll('.node').classed('faded',false);
  nodeLayer.selectAll('circle,polygon')
    .attr('stroke','rgba(255,255,255,0.15)').attr('stroke-width',1);
  linkLayer.selectAll('line').classed('faded',false);
  if(!isMobile()){
    document.getElementById('empty-hint').style.display='block';
    document.getElementById('node-detail-d').style.display='none';
  }
  closeSheet();
  document.getElementById('tap-hint').style.display= isMobile() ? 'block':'none';
}

/* ── Bottom sheet ──────────────────────────────────────────── */
function openSheet(){
  const s=document.getElementById('bottom-sheet');
  s.style.display='flex'; requestAnimationFrame(()=>s.classList.add('open'));
}
function closeSheet(){
  const s=document.getElementById('bottom-sheet');
  s.classList.remove('open');
  setTimeout(()=>{ if(!s.classList.contains('open')) s.style.display='none'; },350);
}

document.getElementById('sheet-close').addEventListener('click', deselect);

// Swipe down to close
let sheetStartY=0;
const sheetEl=document.getElementById('bottom-sheet');
sheetEl.addEventListener('touchstart',e=>{ sheetStartY=e.touches[0].clientY; },{passive:true});
sheetEl.addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].clientY-sheetStartY;
  if(dy>60) deselect();
},{passive:true});

/* ── Tooltip ───────────────────────────────────────────────── */
const tipEl=document.getElementById('tooltip');
function showTip(e,d){
  tipEl.innerHTML=`<strong>${d.label_fa||d.label}</strong><br>${d.full_fa||d.full}<br>`+
    `<span style="color:var(--text-dim)">${BLOCK_FA[d.block]||d.block} · مرکزیت: ${d.strength.toFixed(3)}</span>`;
  tipEl.style.opacity=1; moveTip(e);
}
function moveTip(e){ tipEl.style.left=(e.clientX+14)+'px'; tipEl.style.top=(e.clientY-12)+'px'; }
function hideTip(){ tipEl.style.opacity=0; }

/* ── Controls ──────────────────────────────────────────────── */
document.getElementById('threshold-slider').addEventListener('input',function(){
  const v=+this.value;
  document.getElementById('threshold-val').textContent=
    v.toFixed(2).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  deselect(); build(v);
});
document.getElementById('color-mode').addEventListener('change',function(){
  colorMode=this.value; draw(); buildLegend();
});
document.getElementById('reset-btn').addEventListener('click',()=>{
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity);
  deselect();
});

/* ── Legend ────────────────────────────────────────────────── */
function buildLegend(){
  const grid=document.getElementById('legend-grid');
  const title=document.getElementById('legend-title');
  grid.innerHTML='';
  const entries= colorMode==='block' ? BLOCK_COLORS : FACTOR_COLORS;
  const labels = colorMode==='block' ? BLOCK_FA : FACTOR_FA;
  title.textContent= colorMode==='block'?'دسته‌بندی':'عوامل EFA';
  Object.entries(entries).forEach(([k,col])=>{
    const item=document.createElement('div');
    item.className='lg-item'; item.style.color=col;
    const dot=document.createElement('div'); dot.className='lg-dot'; dot.style.background=col;
    item.appendChild(document.createTextNode(labels[k]||k));
    item.appendChild(dot);
    grid.appendChild(item);
  });
}

/* ── Resize ────────────────────────────────────────────────── */
window.addEventListener('resize', ()=>{
  if(sim) sim.force('center', d3.forceCenter(W()/2,H()/2)).alpha(0.1).restart();
  document.getElementById('tap-hint').style.display= isMobile()?'block':'none';
});

/* ── Init ──────────────────────────────────────────────────── */
document.getElementById('tap-hint').style.display= isMobile()?'block':'none';
build(0.05);
buildLegend();
</script>
